<style>

  :root {
    --accent:      #0ea5e9;
    --accent-dark: #0369a1;
    --navy:        #0f172a;
    --navy-mid:    #1e293b;
    --slate:       #64748b;
    --border:      #e2e8f0;

  /* ── Typography ── */
  body, .masthead, .page__content, .sidebar,
  h1, h2, h3, h4, h5, h6, .btn, input, select, textarea {

  }

  /* ── Masthead / nav ── */
  .masthead {
    background: #fff !important;
    border-bottom: 1px solid var(--border) !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06) !important;
  }
  .masthead__inner-wrap {
    padding-top: 0.75rem !important;
    padding-bottom: 0.75rem !important;
  }
  .site-title {
    font-weight: 700 !important;
    letter-spacing: -0.02em !important;
    color: var(--navy) !important;
    font-size: 1.15rem !important;
  }
  .greedy-nav a {
    font-weight: 500 !important;
    letter-spacing: 0.01em !important;
  }
  .greedy-nav .visible-links a:hover,
  .greedy-nav .visible-links a:focus {
    color: var(--accent-dark) !important;
  }
  .greedy-nav .visible-links a::before {
    background: var(--accent) !important;
  }

  /* ── Hero (splash page) ── */
  .page__hero--overlay {
    background-color: var(--navy) !important;
    background-blend-mode: luminosity !important;
    padding: 5em 1em !important;

    font-weight: 800 !important;
    letter-spacing: -0.03em !important;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;

    font-size: 1.2em !important;
    opacity: 0.92 !important;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3) !important;
  }

  .btn {

    background: var(--accent) !important;
    border-color: var(--accent) !important;
    color: #fff !important;
  }
  .btn--light-outline:hover,
  .btn--inverse:hover {

    border-color: var(--accent-dark) !important;

  }
  .btn--primary {

    border-color: var(--accent-dark) !important;

    transform: translateY(-1px) !important;

    letter-spacing: -0.01em !important;
    color: var(--navy) !important;
    font-size: 1.05em !important;
    margin-top: 0 !important;

  /* ── Intro excerpt (home page) ── */
  .page__content p:first-child {
    font-size: 1.1em !important;
    color: var(--slate) !important;
    line-height: 1.7 !important;

    font-weight: 800 !important;
    letter-spacing: -0.03em !important;

  .nav__list .active > a:visited {
    color: var(--accent-dark) !important;
    font-weight: 600 !important;
  }
  .nav__list a:hover {
    color: var(--accent-dark) !important;
  }

  .page__footer {
    background: var(--navy) !important;
    color: #94a3b8 !important;
  }
  .page__footer a {
    color: #94a3b8 !important;
  }
  .page__footer a:hover {
    color: #fff !important;
  }
  .page__footer-follow .social-icons .svg-inline--fa {
    color: inherit !important;
  }

  .page__content { line-height: 1.75 !important; }
  code, pre { border-radius: 6px !important; }
